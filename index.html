<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShorePoint — Mission Defense</title>
<meta name="description" content="ShorePoint — mission-first cyber resilience. Secure missions through advanced cyber defense.">
<meta name="theme-color" content="#0d3a7a">
<style>
/* ------------------------------------------------------------------
   Fonts (embedded, offline)
------------------------------------------------------------------- */
@font-face{font-family:"SP Display";src:url(assets/fonts/sp-display.woff2) format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"SP Num";src:url(assets/fonts/sp-num.woff2) format("woff2");font-weight:200 700;font-display:block}
@font-face{font-family:"SP Head";src:url(assets/fonts/sp-head.woff2) format("woff2");font-weight:100 700;font-display:block}

@font-face{font-family:"SP Sans";src:url(assets/fonts/sp-sans-400.woff2) format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"SP Sans";src:url(assets/fonts/sp-sans-500.woff2) format("woff2");font-weight:500;font-display:block}
@font-face{font-family:"SP UI";src:url(assets/fonts/sp-ui-400.woff2) format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"SP UI";src:url(assets/fonts/sp-ui-500.woff2) format("woff2");font-weight:500;font-display:block}
@font-face{font-family:"SP UI";src:url(assets/fonts/sp-ui-700.woff2) format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"SP Serif";src:url(assets/fonts/sp-serif.woff2) format("woff2");font-weight:600;font-display:block}

/* ------------------------------------------------------------------
   Design tokens
   Reference artboard: 1448 x 1086. Every measurement below is in
   artboard pixels and multiplied by --k (the live scale factor).
------------------------------------------------------------------- */
:root{
  --ink:#ffffff;
  --ink-dim:rgba(255,255,255,.78);
  --accent:#59cbf5;            /* "advanced"            */
  --accent-link:#2ac6f6;       /* "Explore services"    */
  --stat-top:#5cc6fd;          /* 10+ gradient          */
  --stat-bot:#9eeffe;
  --cross:#3aaef0;             /* logo crosshair        */
  --hair:rgba(255,255,255,.15);/* frame hairlines       */
  --sky-top:#0c3d7d;
  --plate:url(assets/images/hero-plate.webp);
  --ground:#070b08;

  --f-head:"SP Head",Antonio,"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --f-display:"SP Display","Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --f-sans:"SP Sans","IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --f-ui:"SP UI",Arimo,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-serif:"SP Serif",Cinzel,"Trajan Pro",Georgia,serif;

  /* uniform scale: artboard fits the viewport on its limiting axis */
  --vh:100vh;
  --u:min(calc(100vw / 1448), calc(var(--vh) / 1086));
  --k:var(--u);
}
@supports (height:100dvh){ :root{ --vh:100dvh; } }

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--f-ui);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:geometricPrecision;
  overflow:hidden;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:none}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ------------------------------------------------------------------
   Hero shell — always exactly the viewport, no letterboxing.
   Layers: sky/bg  ->  headline  ->  hill  ->  chrome/UI
   Vertical anchoring: top chrome pinned to top, everything else
   pinned to bottom, so extra height becomes open sky.
------------------------------------------------------------------- */
.hero{
  position:relative;
  width:100vw;height:var(--vh);
  overflow:hidden;
  isolation:isolate;
  background:linear-gradient(180deg,#0b3874 0%,#14508f 40%,#3d7fc0 100%);
}
.bg{
  position:absolute;left:50%;bottom:0;z-index:0;
  width:calc(1448 * var(--k));height:calc(1086 * var(--k));
  transform:translateX(-50%);
  background:var(--plate) center/100% 100% no-repeat;
}

.scene{
  position:absolute;left:50%;bottom:0;z-index:1;
  width:calc(1448 * var(--k));height:calc(1086 * var(--k));
  transform:translateX(-50%);
  pointer-events:none;
}
.scene > *{pointer-events:auto}

/* MISSION  DEFENSE ------------------------------------------------ */
.headline{position:absolute;inset:0;z-index:1;font-family:var(--f-head);font-weight:660;
  font-size:calc(194.2 * var(--k));line-height:1;white-space:nowrap;font-variation-settings:"wght" 660}
.headline .w{position:absolute;top:calc(265 * var(--k));height:calc(200 * var(--k));display:block}
.headline .w1{left:0;width:calc(724 * var(--k));
  -webkit-mask-image:linear-gradient(157.95deg,#000 45.4%,rgba(0,0,0,.135) 100%);
          mask-image:linear-gradient(157.95deg,#000 45.4%,rgba(0,0,0,.135) 100%)}
.headline .w2{left:calc(724 * var(--k));width:calc(724 * var(--k));
  -webkit-mask-image:linear-gradient(207.7deg,#000 50.1%,rgba(0,0,0,0) 92.6%);
          mask-image:linear-gradient(207.7deg,#000 50.1%,rgba(0,0,0,0) 92.6%)}
.headline b{position:absolute;top:0;font-weight:inherit;color:#fbfcfd;transform:translateX(-50%)}
.headline .w2 b{margin-left:calc(-724 * var(--k))}

.hill{position:absolute;left:0;top:0;z-index:2;width:calc(1448 * var(--k));height:calc(1086 * var(--k));
  transform:translateX(calc(-4 * var(--k)));
  background:url(assets/images/terrain.webp) 0 0/100% 100% no-repeat}

/* vault "Explore" puck */
.puck{position:absolute;z-index:3;left:calc(685.25 * var(--k));top:calc(562 * var(--k));
  width:calc(78.5 * var(--k));height:calc(78.5 * var(--k));border-radius:50%;
  display:grid;place-items:center;
  font-family:var(--f-ui);font-weight:700;font-size:calc(13.4 * var(--k));color:#141414;letter-spacing:calc(.05 * var(--k));
  background:linear-gradient(165deg,#fdfbf9 0%,#f3f2f0 28%,#e2e2e1 55%,#cfd0d0 78%,#bcbdbd 100%);
  box-shadow:0 0 0 calc(1 * var(--k)) rgba(20,24,24,.55),0 calc(3 * var(--k)) calc(7 * var(--k)) rgba(0,0,0,.3),
             inset 0 calc(1 * var(--k)) calc(1 * var(--k)) rgba(255,255,255,.9);
  transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.puck::before{content:"";position:absolute;inset:calc(3.5 * var(--k));border-radius:50%;
  border:calc(1 * var(--k)) solid rgba(0,0,0,.06);box-shadow:inset 0 calc(1 * var(--k)) 0 rgba(255,255,255,.75),0 calc(1 * var(--k)) 0 rgba(255,255,255,.35)}
.puck span{position:relative;transform:translateY(calc(-1 * var(--k)))}
.puck:hover{transform:scale(1.06)}
.puck:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

.stem{position:absolute;z-index:3;left:calc(723 * var(--k));top:calc(641 * var(--k));
  width:calc(1.6 * var(--k));height:calc(185 * var(--k));
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.34) 60%,rgba(255,255,255,.4))}
.node{position:absolute;z-index:4;left:calc(719.5 * var(--k));top:calc(821.5 * var(--k));
  width:calc(9 * var(--k));height:calc(9 * var(--k));border-radius:50%;background:#fff;
  box-shadow:0 0 calc(6 * var(--k)) rgba(255,255,255,.55)}

/* ------------------------------------------------------------------
   Chrome (edge-anchored UI)
------------------------------------------------------------------- */
.chrome{position:absolute;inset:0;z-index:5;pointer-events:none}
.chrome > *{pointer-events:auto}
.top,.bottom{position:absolute;left:0;right:0;height:0}
.top{top:0}
.bottom{bottom:0}
.top > *,.bottom > *,.logo,.badge,.badge-txt,.ico,.bird,.pill,.dots,.stat,.stat-txt,.card,.pitch,.more{position:absolute}
.bar,.strip,.strip-l,.strip-r,.statrow,.hillbox{display:contents}

/* frame hairlines */
.vline{top:calc(110 * var(--k));bottom:0;width:calc(1 * var(--k));
  background:linear-gradient(180deg,rgba(255,255,255,0) 0,rgba(255,255,255,.15) calc(130 * var(--k)),rgba(255,255,255,.15) 70%,rgba(255,255,255,.07) 100%)}
.vline.l{left:calc(61.5 * var(--k))}
.vline.r{right:calc(61.5 * var(--k))}
.hline{left:calc(62 * var(--k));right:calc(62 * var(--k));height:calc(1 * var(--k))}
.hline.t{top:calc(245 * var(--k));
  background:linear-gradient(90deg,rgba(255,255,255,.17),rgba(255,255,255,.1) 50%,rgba(255,255,255,.2))}
.hline.b{bottom:calc(259.5 * var(--k));
  background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.2) 50%,rgba(255,255,255,.14))}

/* nav */
.nav-link,.contact{top:calc(51 * var(--k));font-size:calc(15.5 * var(--k));line-height:1;
  letter-spacing:calc(0.2 * var(--k));white-space:nowrap;transition:opacity .2s}
.nav-link:hover,.contact:hover{opacity:.72}
.n1{left:calc(117 * var(--k))}.n2{left:calc(253 * var(--k))}.n3{left:calc(388 * var(--k))}
.contact{right:calc(297 * var(--k));letter-spacing:calc(0.3 * var(--k))}
.cta{right:calc(91 * var(--k));top:calc(34 * var(--k));width:calc(173 * var(--k));height:calc(44 * var(--k));
  border:calc(2 * var(--k)) solid rgba(255,255,255,.96);border-radius:calc(22 * var(--k));
  display:grid;place-items:center;font-size:calc(15.5 * var(--k));line-height:1;font-weight:500;
  letter-spacing:calc(0 * var(--k));
  background:rgba(255,255,255,.01);transition:background .25s,color .25s}
.cta span{transform:translateY(calc(2 * var(--k)))}
.cta:hover{background:#fff;color:#0d3a7a}

/* logo */
.logo{left:calc(50% - 124 * var(--k));top:calc(10 * var(--k));width:calc(250 * var(--k));height:calc(96 * var(--k));display:block}
.logo svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.logo .word{position:absolute;left:calc(9 * var(--k));top:calc(37 * var(--k));
  font-family:var(--f-serif);font-weight:600;line-height:1;white-space:nowrap;
  font-size:calc(23 * var(--k));letter-spacing:calc(6.8 * var(--k));
  text-shadow:0 0 calc(1 * var(--k)) rgba(255,255,255,.25)}
.logo .word b{font-weight:inherit;font-size:calc(26.8 * var(--k))}
.logo .word b + b{letter-spacing:calc(3.2 * var(--k))}

/* birds */
.bird{background:url(assets/images/bird.webp) no-repeat}

/* top-left badge */
.badge{left:calc(88 * var(--k));top:calc(163 * var(--k));display:block}
.badge img{width:calc(43.2 * var(--k));height:calc(57.6 * var(--k));filter:brightness(.84) contrast(1.06)}
.badge-txt{left:calc(148 * var(--k));top:calc(169.4 * var(--k));font-size:calc(16.8 * var(--k));
  line-height:calc(21 * var(--k));letter-spacing:calc(-0.6 * var(--k));text-transform:uppercase;white-space:nowrap}

/* round icons */
.ico{width:calc(40 * var(--k));height:calc(40 * var(--k));top:calc(165.5 * var(--k));border-radius:50%;
  display:grid;place-items:center;transition:background .25s}
.ico:hover{background:rgba(255,255,255,.12)}
.ico svg{width:100%;height:100%;overflow:visible}
.ico.radar{right:calc(144.5 * var(--k))}
.ico.risk{right:calc(94.5 * var(--k))}

/* bottom-left */
.pill{left:calc(95 * var(--k));bottom:calc(180 * var(--k));width:calc(154 * var(--k));height:calc(34 * var(--k));
  border-radius:calc(17 * var(--k));border:calc(1.6 * var(--k)) solid rgba(255,255,255,.8);
  background:rgba(4,8,2,.52);-webkit-backdrop-filter:blur(calc(6 * var(--k)));backdrop-filter:blur(calc(6 * var(--k)));
  display:grid;place-items:center;font-size:calc(15.8 * var(--k));line-height:1;letter-spacing:calc(0.1 * var(--k));white-space:nowrap}
.pill span{transform:translateY(calc(0.5 * var(--k)))}
.dots{left:calc(380 * var(--k));bottom:calc(192 * var(--k));display:flex;gap:calc(6 * var(--k))}
.dots i{display:block;width:calc(8.5 * var(--k));height:calc(8.5 * var(--k));border-radius:50%;
  border:calc(1.2 * var(--k)) solid rgba(255,255,255,.85)}
.dots i.on{background:#fff;border-color:#fff}

.stat{left:calc(99 * var(--k));bottom:calc(63 * var(--k));font-family:"SP Num",Oswald,var(--f-head);filter:drop-shadow(0 0 calc(.8 * var(--k)) rgba(4,30,60,.55));font-weight:350;font-variation-settings:"wght" 350;
  font-size:calc(64.2 * var(--k));line-height:1;transform:scaleX(1);transform-origin:0 0;letter-spacing:calc(-5 * var(--k));
  background:linear-gradient(180deg,var(--stat-top),var(--stat-bot));-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent}
.stat .plus{position:absolute;left:calc(53 * var(--k));top:calc(25.2 * var(--k));width:calc(25 * var(--k));height:calc(26 * var(--k));
  background:linear-gradient(180deg,#6dd0fd,#90e5fe) calc(10 * var(--k)) 0/calc(5 * var(--k)) 100% no-repeat,
             linear-gradient(180deg,#78d8fd,#7fdcfd) 0 calc(10 * var(--k))/100% calc(6 * var(--k)) no-repeat}
.stat-txt{left:calc(201 * var(--k));bottom:calc(59.5 * var(--k));font-family:var(--f-sans);
  font-size:calc(16 * var(--k));line-height:calc(22 * var(--k));letter-spacing:calc(0 * var(--k));white-space:nowrap}

/* centre glass card */
.card{left:calc(50% - 153.5 * var(--k));top:auto;bottom:calc(-40 * var(--k));width:calc(309 * var(--k));height:calc(257 * var(--k));
  overflow:hidden;
  background:linear-gradient(180deg,rgba(26,31,23,.93) 0%,rgba(20,26,19,.95) 30%,rgba(10,16,13,.97) 60%,rgba(8,13,11,.98) 100%);
  -webkit-backdrop-filter:blur(calc(14 * var(--k)));backdrop-filter:blur(calc(14 * var(--k)));
  box-shadow:inset 0 calc(1 * var(--k)) 0 rgba(255,255,255,.04)}
.card h3{position:absolute;left:0;right:0;top:calc(22.2 * var(--k));text-align:center;font-weight:400;
  font-size:calc(16.5 * var(--k));line-height:1;letter-spacing:calc(-0.3 * var(--k))}
.card hr{position:absolute;left:calc(17 * var(--k));right:calc(17 * var(--k));top:calc(54 * var(--k));height:calc(1.6 * var(--k));border:0;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.16) 18%,rgba(255,255,255,.16) 82%,rgba(255,255,255,0))}
.card img{position:absolute;left:calc(53 * var(--k));top:calc(41 * var(--k));width:calc(246.1 * var(--k));height:auto}

/* bottom-right */
.pitch{left:calc(100% - 419 * var(--k));bottom:calc(112 * var(--k));
  font-family:var(--f-sans);font-size:calc(30 * var(--k));line-height:calc(36 * var(--k));
  letter-spacing:calc(0.5 * var(--k));white-space:nowrap;font-weight:400}
.pitch em{font-style:normal;color:var(--accent)}
.pitch .lock{display:inline-block;width:calc(17 * var(--k));height:calc(16 * var(--k));vertical-align:0;
  margin:0 calc(8 * var(--k)) 0 calc(3 * var(--k));transform:translateY(calc(0 * var(--k)))}
.more{left:calc(100% - 418 * var(--k));bottom:calc(65 * var(--k));
  font-family:var(--f-sans);font-size:calc(17 * var(--k));line-height:1;color:var(--accent-link);
  letter-spacing:calc(0 * var(--k));white-space:nowrap;
  text-decoration:underline;text-decoration-thickness:calc(1.5 * var(--k));text-underline-offset:calc(1.5 * var(--k));transition:color .2s}
.more:hover{color:#fff}


/* ------------------------------------------------------------------
   ENTRANCE — one-shot. Initial states exist only while html.sp-enter
   is set (added by an inline head script, removed when the timeline
   completes or by a fail-safe). No class = the static design.
------------------------------------------------------------------- */
.vline{transform-origin:50% 0}
.stem{transform-origin:50% 0}
html.sp-enter :is(.logo,.nav-link,.contact,.cta,.burger,.badge,.badge-txt,.ico,.puck,.node,
  .pill,.dots,.stat,.stat-txt,.pitch,.more){opacity:0}
html.sp-enter .headline .w{clip-path:inset(-40% -12% 0 -12%)}
html.sp-enter .headline b{translate:0 112%}
html.sp-enter :is(.hline.t,.hline.b){scale:0 1}
html.sp-enter :is(.vline,.stem){scale:1 0}
html.sp-enter .card{clip-path:inset(100% 0 0 0)}

/* menu toggle (compact layouts only) */
.burger,.drawer{display:none}

/* ------------------------------------------------------------------
   Wider than artboard: plate covers the width, hill feathers into it
------------------------------------------------------------------- */
@media (min-aspect-ratio: 1449/1086){
  .bg{width:100vw;height:calc(100vw * 1086 / 1448);bottom:auto;top:calc((var(--vh) - 100vw * 1086 / 1448) * .55)}
  .hill{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%);
        mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%)}
}
/* taller than artboard: sky fill above the plate, feathered seam */
@media (max-aspect-ratio: 1447/1086){
  .bg{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 calc(140 * var(--k)));
      mask-image:linear-gradient(180deg,transparent 0,#000 calc(140 * var(--k)))}
}

/* ------------------------------------------------------------------
   Compact layout — phones, portrait tablets, short landscape screens.
   The artboard would get too small to read, so the page reflows into
   a stacked composition with its own unit (--m = 1px @ 390px wide).
------------------------------------------------------------------- */
@media (max-width: 760px), (max-aspect-ratio: 11/10), (max-height: 520px) and (max-width: 1100px){
  :root{ --m:clamp(.82px, min(calc(100vw / 390), calc(var(--vh) / 700)), 1.6px); --k:var(--m); }
  body{overflow-x:hidden;overflow-y:auto}
  .hero{height:auto;min-height:var(--vh);display:flex;flex-direction:column;overflow:hidden;background:var(--ground)}
  .chrome{position:static;display:contents}
  .top,.bottom{position:static;height:auto}
  .top > *,.bottom > *,.logo,.badge,.badge-txt,.ico,.ico.radar,.ico.risk,.pill,.dots,.stat,.stat-txt,.pitch,.more,.card{
    position:relative;left:auto;right:auto;top:auto;bottom:auto}
  .bar,.strip,.strip-l,.strip-r,.statrow{display:flex}
  .vline,.hline,.stem,.node,.bird,.contact,.nav-link,.cta,.bg{display:none}

  /* plate lives behind the scene and reaches up under the bar */
  .scene::before{content:"";position:absolute;z-index:-1;left:0;right:0;bottom:0;top:calc(-170 * var(--m));
    background:var(--plate) 50% 100%/cover no-repeat}

  /* bar */
  .bar{position:relative;z-index:6;align-items:center;justify-content:space-between;
       width:100%;max-width:calc(420 * var(--m));margin:0 auto;height:calc(72 * var(--m));padding:0 calc(16 * var(--m))}
  .logo{--k:calc(.72 * var(--m));width:calc(250 * var(--k));height:calc(96 * var(--k));margin-left:calc(-10 * var(--m))}
  .burger{display:grid;place-items:center;width:calc(44 * var(--m));height:calc(44 * var(--m));border-radius:50%;
          border:calc(1.5 * var(--m)) solid rgba(255,255,255,.9);transition:background .25s}
  .burger:hover{background:rgba(255,255,255,.1)}
  .burger i,.burger i::before,.burger i::after{display:block;width:calc(16 * var(--m));height:calc(1.6 * var(--m));background:#fff;border-radius:2px;position:relative;transition:transform .3s,background .3s}
  .burger i::before,.burger i::after{content:"";position:absolute;left:0}
  .burger i::before{top:calc(-5 * var(--m))}.burger i::after{top:calc(5 * var(--m))}
  .menu-open .burger i{background:transparent}
  .menu-open .burger i::before{transform:translateY(calc(5 * var(--m))) rotate(45deg)}
  .menu-open .burger i::after{transform:translateY(calc(-5 * var(--m))) rotate(-45deg)}
  .drawer{display:flex;flex-direction:column;gap:calc(2 * var(--m));position:absolute;z-index:20;
    top:calc(72 * var(--m));left:50%;width:calc(100% - 32 * var(--m));max-width:calc(388 * var(--m));padding:calc(10 * var(--m));
    border-radius:calc(18 * var(--m));border:1px solid rgba(255,255,255,.18);
    background:rgba(9,32,70,.6);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);
    opacity:0;transform:translate(-50%,calc(-8 * var(--m)));pointer-events:none;transition:opacity .25s,transform .25s}
  .menu-open .drawer{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .drawer a{font-size:calc(16 * var(--m));padding:calc(12 * var(--m)) calc(12 * var(--m));border-radius:calc(10 * var(--m))}
  .drawer a:hover{background:rgba(255,255,255,.08)}
  .drawer .d-cta{margin-top:calc(6 * var(--m));text-align:center;border:calc(1.5 * var(--m)) solid #fff;border-radius:999px;font-weight:500}

  /* badge row */
  .strip{position:relative;z-index:6;align-items:center;justify-content:space-between;
    width:calc(100% - 32 * var(--m));max-width:calc(388 * var(--m));margin:0 auto;
    padding:calc(6 * var(--m)) 0 calc(14 * var(--m));border-bottom:1px solid var(--hair)}
  .strip-l{align-items:center;gap:calc(12 * var(--m))}
  .badge img{width:calc(32 * var(--m));height:calc(42.7 * var(--m))}
  .badge-txt{font-size:calc(13 * var(--m));line-height:calc(17 * var(--m));letter-spacing:0}
  .strip-r{gap:calc(8 * var(--m))}
  .ico{width:calc(36 * var(--m));height:calc(36 * var(--m))}

  /* scene */
  .scene{position:relative;left:auto;bottom:auto;transform:none;width:100%;height:auto;flex:1 0 auto;
    display:flex;flex-direction:column;pointer-events:auto}

<script>
/* ==================================================================
   ShorePoint — entrance timeline (Web Animations API, no library)
   Runs once per page load. When it completes, every animation is
   cancelled and the page is left in its authored, static state.
================================================================== */
(function(){
  var d=document.documentElement;
  if(!d.classList.contains('sp-enter')) return;
  var COMPACT='(max-width: 760px), (max-aspect-ratio: 11/10), (max-height: 520px) and (max-width: 1100px)';
  var EXPO='cubic-bezier(.16,1,.3,1)',      /* expo-out: arrivals            */
      QUART='cubic-bezier(.25,1,.5,1)',     /* quart-out: small UI settles   */
      DRAW='cubic-bezier(.77,0,.18,1)';     /* in-out: lines being drawn     */
  var ran=false, anims=[];

  function $(q){return document.querySelector(q)}
  function $$(q){return Array.prototype.slice.call(document.querySelectorAll(q))}
  function visible(el){ /* rendered (not display:none) and starting inside the first viewport */
    if(!el || !el.getClientRects().length) return false; return el.getBoundingClientRect().top<innerHeight; }
  function unit(){ var p=document.createElement('i'); p.style.cssText='position:absolute;visibility:hidden;width:calc(100 * var(--k))';
    document.body.appendChild(p); var k=p.getBoundingClientRect().width/100; p.remove(); return k||1; }

  /* add one tween to the master timeline: t = start (s), dur (s) */
  function at(t,el,frames,dur,ease){
    if(!el || !visible(el)) return;
    anims.push(el.animate(frames,{delay:t*1000,duration:dur*1000,easing:ease,fill:'both'}));
  }
  function settle(t,el,dy,dur){ at(t,el,[{opacity:0,translate:'0 '+dy+'px'},{opacity:1,translate:'0 0'}],dur,QUART); }

  function finish(){
    anims.forEach(function(a){ a.cancel(); });          /* drop all effects…            */
    d.classList.remove('sp-enter');                     /* …and the initial states, same frame */
    anims=[];
  }

  function run(){
    if(ran) return; ran=true; clearTimeout(window.__spFailSafe);
    var k=unit(), compact=matchMedia(COMPACT).matches, s=compact?0.82:1;

    /* 01 — STRUCTURE: the frame draws itself */
    at(0.00,$('.hline.t'),[{scale:'0 1'},{scale:'1 1'}],1.15,DRAW);
    $$('.vline').forEach(function(v){ at(0.08,v,[{scale:'1 0'},{scale:'1 1'}],1.35,DRAW); });

    /* 02 — NAVIGATION: logo first, links ripple outward from it */
    settle(0.12,$('.logo'),-8*k,0.9);
    [['.n3',0.22],['.n2',0.27],['.n1',0.32],['.contact',0.22],['.cta',0.27],['.burger',0.24]].forEach(function(n){ settle(n[1],$(n[0]),-6*k,0.7); });

    /* 03 — HEADLINE: letters rise out of a baseline mask, centre → outward */
    var w1=$$('.headline .w1 b').reverse(), w2=$$('.headline .w2 b');
    for(var i=0;i<7;i++){
      [w1[i],w2[i]].forEach(function(b){
        at(0.36*s+i*0.034,b,[{translate:'0 112%'},{translate:'0 0'}],compact?1.05:1.25,EXPO);
      });
    }

    /* 04 — CONTEXT ROW: badge + capabilities settle under the nav */
    settle(0.62*s,$('.badge'),-6*k,0.75);
    settle(0.67*s,$('.badge-txt'),-6*k,0.75);
    settle(0.64*s,$('.ico.radar'),-6*k,0.75);
    settle(0.69*s,$('.ico.risk'),-6*k,0.75);

    /* 05 — FOCAL CTA: the vault's Explore puck seats itself */
    at(1.00*s,$('.puck'),[{opacity:0,scale:'.86'},{opacity:1,scale:'1'}],0.85,EXPO);

    if(!compact){
      /* 06 — CONTINUITY: line descends from the puck, node lands, rule spreads from it */
      at(1.28,$('.stem'),[{scale:'1 0'},{scale:'1 1'}],0.5,DRAW);
      at(1.68,$('.node'),[{opacity:0,scale:'.2'},{opacity:1,scale:'1'}],0.45,EXPO);
      at(1.68,$('.hline.b'),[{scale:'0 1'},{scale:'1 1'}],1.1,EXPO);

      /* 07 — GROUND ROW: card rises out of the bottom edge, then both flanks */
      at(1.62,$('.card'),[{clipPath:'inset(100% 0 0 0)'},{clipPath:'inset(0% 0 0 0)'}],1.0,EXPO);
      at(1.68,$('.card img'),[{translate:'0 '+(18*k)+'px'},{translate:'0 0'}],1.15,EXPO);
      settle(1.78,$('.pill'),10*k,0.7);
      settle(1.84,$('.dots'),10*k,0.7);
      settle(1.86,$('.stat'),10*k,0.75);
      settle(1.92,$('.stat-txt'),10*k,0.7);
      settle(1.80,$('.pitch'),10*k,0.75);
      settle(1.94,$('.more'),10*k,0.7);
    }

    if(!anims.length){ finish(); return; }
    Promise.all(anims.map(function(a){return a.finished})).then(finish,finish);
  }

  var go=function(){ requestAnimationFrame(function(){ requestAnimationFrame(run); }); };
  try{ (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(go,go); }
  catch(e){ finish(); }
})();
